<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="A two-axis diagram. The work axis runs left to right through five phases, each fed by a dashed rail from an /initiate dispatcher box: /backlog (plan and maintain), /spec (design), /build, /verify (test), and /ship (deploy), with arrows connecting each to the next. A curved return arrow runs from /ship back to /backlog, labelled 'next item'. Below, a session axis row lists /handoff and /end-task, connected to the phase row by a thin vertical line labelled 'runs alongside any phase'. A small Phase-Gate wordmark sits at the bottom.">
  <rect x="0" y="0" width="900" height="420" fill="#FAF9F5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6A61"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A94F33"/>
    </marker>
  </defs>

  <!-- dispatcher -->
  <rect x="20" y="20" width="120" height="40" rx="5" fill="#141413"/>
  <text x="80" y="39" font-family="'JetBrains Mono', monospace" fill="#F5F4ED" font-size="12" font-weight="700" text-anchor="middle">/initiate</text>
  <text x="80" y="51" font-family="'JetBrains Mono', monospace" fill="#F5F4ED" opacity="0.75" font-size="7.5" text-anchor="middle">detect, then route</text>
  <g stroke="#6B6A61" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <line x1="140" y1="40" x2="810" y2="40"/>
    <line x1="90" y1="140" x2="90" y2="40"/>
    <line x1="270" y1="140" x2="270" y2="40" marker-end="url(#arrow)"/>
    <line x1="450" y1="140" x2="450" y2="40" marker-end="url(#arrow)"/>
    <line x1="630" y1="140" x2="630" y2="40" marker-end="url(#arrow)"/>
    <line x1="810" y1="140" x2="810" y2="40" marker-end="url(#arrow)"/>
  </g>

  <!-- work axis: five phase boxes -->
  <g>
    <rect x="20" y="140" width="140" height="80" rx="6" fill="#FAF9F5" stroke="#A94F33" stroke-width="2.5"/>
    <text x="90" y="176" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="middle">PLAN + MAINTAIN</text>
    <text x="90" y="197" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="15" text-anchor="middle">/backlog</text>

    <rect x="200" y="140" width="140" height="80" rx="6" fill="#FAF9F5" stroke="#A94F33" stroke-width="2.5"/>
    <text x="270" y="176" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="middle">DESIGN</text>
    <text x="270" y="197" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="15" text-anchor="middle">/spec</text>

    <rect x="380" y="140" width="140" height="80" rx="6" fill="#FAF9F5" stroke="#A94F33" stroke-width="2.5"/>
    <text x="450" y="176" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="middle">BUILD</text>
    <text x="450" y="197" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="15" text-anchor="middle">/build</text>

    <rect x="560" y="140" width="140" height="80" rx="6" fill="#FAF9F5" stroke="#A94F33" stroke-width="2.5"/>
    <text x="630" y="176" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="middle">TEST</text>
    <text x="630" y="197" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="15" text-anchor="middle">/verify</text>

    <rect x="740" y="140" width="140" height="80" rx="6" fill="#FAF9F5" stroke="#A94F33" stroke-width="2.5"/>
    <text x="810" y="176" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="middle">DEPLOY</text>
    <text x="810" y="197" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="15" text-anchor="middle">/ship</text>
  </g>

  <!-- arrows between phases -->
  <g stroke="#141413" stroke-width="2" marker-end="url(#arrowOrange)" fill="none">
    <line x1="160" y1="180" x2="197" y2="180"/>
    <line x1="340" y1="180" x2="377" y2="180"/>
    <line x1="520" y1="180" x2="557" y2="180"/>
    <line x1="700" y1="180" x2="737" y2="180"/>
  </g>

  <!-- return arrow: ship back to backlog -->
  <path d="M810,222 C810,270 90,270 90,222" fill="none" stroke="#6B6A61" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="255" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="9" text-anchor="middle">NEXT ITEM</text>

  <!-- session axis -->
  <line x1="90" y1="222" x2="90" y2="310" stroke="#788C5D" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="102" y="300" font-family="'JetBrains Mono', monospace" fill="#4F5C3B" font-size="9" text-anchor="start">runs alongside any phase</text>
  <rect x="20" y="320" width="820" height="46" rx="6" fill="#FAF9F5" stroke="#788C5D" stroke-width="2"/>
  <text x="40" y="340" font-family="'JetBrains Mono', monospace" fill="#6B6A61" letter-spacing="0.05em" font-size="8" text-anchor="start">SESSION AXIS</text>
  <text x="40" y="358" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="13" text-anchor="start">/handoff · /end-task</text>

  <text x="880" y="405" font-family="'Archivo', sans-serif" font-weight="700" fill="#141413" font-size="13" text-anchor="end">Phase-Gate</text>
</svg>
